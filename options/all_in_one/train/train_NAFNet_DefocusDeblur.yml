# general settings
# CUDA_VISIBLE_DEVICES=4,5,6,7 BASICSR_JIT=True torchrun --master-port 12346 --nproc_per_node 4 basicsr/all_in_one_train.py -opt options/all_in_one/train/train_NAFNet_AIO.yml --launcher pytorch
# BASICSR_JIT=True torchrun --master-port 12346 --nproc_per_node 8 basicsr/all_in_one_train.py -opt options/all_in_one/train/train_NAFNet_AIO.yml --launcher pytorch
name: DefocusDeblur_NAFNet32_LFDOF+DPDDc_300k-256bs32
model_type: SRModel
scale: 1
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0


# progressive_learning:
#   bs: [ 32, 8 ]             # Batch size per gpu
#   iters: [ 500000, 500000 ]
#   gt_size: 256   # Max patch size for progressive training
#   gtsize: [ 128, 256 ]  # Patch sizes for progressive training.
# dataset and data loader settings
datasets:
  train_DPDD:
    name: DPDD
    dataset_class_idx: 3
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/DPDD/train/target_crops
    dataroot_lq: /data/mxt_data/DPDD/train/input_crops
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
#  train_MCBlurDefocus:
#    name: MCBlurDefocus
#    dataset_class_idx: 3
#    type: PairedImageDataset
#    dataroot_gt: /home/ubuntu/uniDeblurDataset/MCBLur/Defocus/train/target_crops
#    dataroot_lq: /home/ubuntu/uniDeblurDataset/MCBLur/Defocus/train/input_crops
#    io_backend:
#      type: disk
#    gt_size: 256
#    use_hflip: true
#    use_rot: true
#    dataset_enlarge_ratio: 1

  train_LFDOF:
    name: LFDOF
    dataset_class_idx: 3
    type: PairedImageDataset
    dataroot_gt: /home/ubuntu/uniDeblurDataset/LFDOF/train_data/ground_truth
    dataroot_lq: /home/ubuntu/uniDeblurDataset/LFDOF/train_data/input
    meta_info_file: /home/ubuntu/uniDeblurDataset/LFDOF/train_data/meta_info_train.txt
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1

  val_1:
    name: DPDD
    dataset_class_idx: 2
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur/DPDD_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_2:
    name: LFDOF
    dataset_class_idx: 2
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur/LFDOF_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_3:
    name: RealDOF
    dataset_class_idx: 2
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur/RealDOF_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
#  val_4:
#    name: MCBlurDefocus
#    dataset_class_idx: 2
#    type: PairedImageDataset
#    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
#    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur
#    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/DefocusBlur/MCBlurDefocus_meta_info.txt
#    io_backend:
#      type: disk
#    num_worker_per_gpu: 1
#    batch_size_per_gpu: 1
#    center_crop: 256
dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 2
  batch_size_per_gpu: 16
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

# network structures
#network_g:
#  type: NAFNetX
#  width: 64
#  patch_size: [[128, 128], [64, 64], [32, 32], [16, 16]]
#  patch_size_latent: [8, 8]
#  enc_blk_nums: [1, 1, 1, 28]
#  middle_blk_num: 1
#  dec_blk_nums: [1, 1, 1, 1]
#  window_size: 8
network_g:
  type: NAFNet
  width: 32
  train_size: [1, 3, 256, 256]
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8

find_unused_parameters: false

path:
  pretrain_network_g: ~ #/data/mxt_code/AllinOne/experiments/UniDeblur_NAFNetX_1000k-6class-new_256bs32/models/net_g_550000.pth
  strict_load_g: true
  param_key_g: params_ema
  resume_state: ~ # /data/mxt_code/AllinOne/experiments/UniDeblur_NAFNetX_1000k-6class-new_256bs32/training_states/550000.state

grad_clip: 0.01

## training settings
#train:
##  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [0.9, 0.9]
#
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#
#  total_iter: 600000  # 1000 epoch 1 nnproc
#  warmup_iter: -1  # no warm up
#  # losses

# training settings
train:
  ema_decay: 0.999
  use_amp: false
#  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [ 0.9, 0.9 ]
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 50000
#    max_epochs: 1000000
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [ 0.9, 0.999 ]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [ 300000 ]
    restart_weights: [ 1 ]
    eta_min: !!float 1e-6
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 40000
#    max_epochs: 600000

  total_iter: 300000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FourierLoss
    loss_weight: 0.01
    reduction: mean


# validation settings
val:
  use_amp: false
  speed: false
  val_freq: !!float 2e4
  save_img: false
#  max_idx: 600
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
#    ssim:
#      type: calculate_ssim
#      crop_border: 0
#      test_y_channel: false
#      image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
