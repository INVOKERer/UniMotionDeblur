#network_g:
#  type: NAFNetX
#  width: 64
#  patch_size: [[64, 64], [32, 32], [16, 16], [8, 8]]
#  patch_size_latent: [8, 8]
#  enc_blk_nums: [1, 1, 1, 28]
#  middle_blk_num: 1
#  dec_blk_nums: [1, 1, 1, 1]
#  window_size: 8
network_g:
  type: NAFNet
  width: 32
  train_size: [1, 3, 256, 256]
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8

find_unused_parameters: false

path:
  pretrain_network_g: /data/mxt_code/AllinOne/experiments/UniDeblurMD_NAFNet32_1000k_256bs32/models/net_g_50000.pth
  strict_load_g: true
  param_key_g: params_ema
  resume_state: /data/mxt_code/AllinOne/experiments/UniDeblurMD_NAFNet32_1000k_256bs32/training_states/50000.state

grad_clip: 0.01

