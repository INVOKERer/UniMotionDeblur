# training settings
train:
  ema_decay: 0.999
  use_amp: false
#  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [ 0.9, 0.9 ]
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 50000
#    max_epochs: 1000000
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [ 0.9, 0.999 ]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [ 1000000 ]
    restart_weights: [ 1 ]
    eta_min: !!float 1e-6
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 40000
#    max_epochs: 600000

  total_iter: 1000000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FourierLoss
    loss_weight: 0.01
    reduction: mean


# validation settings
val:
  use_amp: false
  speed: false
  val_freq: !!float 5e4
  save_img: false
#  max_idx: 600
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
#    ssim:
#      type: calculate_ssim
#      crop_border: 0
#      test_y_channel: false
#      image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
