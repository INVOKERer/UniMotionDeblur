metric_avg_list: []

align_list:
  names: []

slide:
  slide_datasets: []
  mini_bs: 4
  ker_size: [ 384, 384 ]
  overlap_size: [ 48, 48 ]

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 2
  batch_size_per_gpu: 4
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

# network structures
#network_g:
#  type: NAFNetX
#  width: 64
#  patch_size: [[64, 64], [32, 32], [16, 16], [8, 8]]
#  patch_size_latent: [8, 8]
#  enc_blk_nums: [1, 1, 1, 28]
#  middle_blk_num: 1
#  dec_blk_nums: [1, 1, 1, 1]
#  window_size: 8
network_g:
  type: uniDeblurL
  dim: 48
  num_blocks_enc: [1, 4, 8]
  num_blocks_dec: [1, 4, 8]
  baseblock: [localnaf, localnaf, localnaf]
  num_ker_blocks: [2, 3, 3, 4]
  ker_baseblock: EVSS
  ffn_expansion_factor: 3
  bias: false
  train_size: [256, 256]
  patch_size: [256, 256]
  ker_size: [[256, 256], [256, 256], [256, 256], [256, 256]]
  overlap_size: [[32, 32], [32, 32], [32, 32], [32, 32]]
  k_channels: [48, 48, 48, 48]
  ker_start: 1
  window_size: 8
  global_fft: [false, false, false]
  patch_size_fft: [128, 128]
  kernel_learning: [true, true, true, true]
  dec_with_enc: false
  geo_aug: false


find_unused_parameters: false

path:
  pretrain_network_g: ~ # /data/mxt_code/AllinOne/experiments/UniDeblurMD_NAFNet32_1000k_256bs32/models/net_g_50000.pth
  strict_load_g: true
  param_key_g: params_ema
  resume_state: ~ # /data/mxt_code/AllinOne/experiments/UniDeblurMD_NAFNet32_1000k_256bs32/training_states/50000.state

grad_clip: 0.01

## training settings
#train:
##  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [0.9, 0.9]
#
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#
#  total_iter: 600000  # 1000 epoch 1 nnproc
#  warmup_iter: -1  # no warm up
#  # losses

# training settings
train:
  ema_decay: 0.999
  use_amp: false
#  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [ 0.9, 0.9 ]
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 50000
#    max_epochs: 1000000
  optim_g:
    type: AdamW
    lr: !!float 5e-4
    weight_decay: !!float 1e-2
    betas: [ 0.9, 0.999 ]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [ 300000 ]
    restart_weights: [ 1 ]
    eta_min: !!float 1e-6
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 40000
#    max_epochs: 600000

  total_iter: 300000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FourierLoss
    loss_weight: 0.01
    reduction: mean


# validation settings
val:
  use_amp: false
  speed: false
  val_freq: !!float 5e4
  save_img: false
#  max_idx: 600
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
#    ssim:
#      type: calculate_ssim
#      crop_border: 0
#      test_y_channel: false
#      image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e-4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
