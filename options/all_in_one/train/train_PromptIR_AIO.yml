#Accelerator:
#  mixed_precision: 'fp16'
#  split_batches: false
dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 2
  batch_size_per_gpu: 2
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

# network structures
network_g:
  type: PromptIR
  window_size: 8

find_unused_parameters: false

path:
  pretrain_network_g: ~ # /data/mxt_code/AllinOne/experiments/UniDeblur_PromptIR_600k-2e-4-128bs16_amp/models/net_g_540000.pth
  strict_load_g: true
  param_key_g: params
  resume_state: ~ # /data/mxt_code/AllinOne/experiments/UniDeblur_PromptIR_600k-2e-4-128bs16_amp/training_states/540000.state

grad_clip: 0.01

# training settings
train:
  ema_decay: 0.999
  use_amp: false
#  ema_decay: 0.999
#  optim_g:
#    type: AdamW
#    lr: !!float 1e-3
#    weight_decay: !!float 1e-3
#    betas: [ 0.9, 0.9 ]
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 50000
#    max_epochs: 1000000
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [ 0.9, 0.999 ]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [ 1000000 ]
    restart_weights: [ 1 ]
    eta_min: !!float 1e-6
#  scheduler:
#    type: TrueCosineAnnealingLR
#    T_max: 600000
#    eta_min: !!float 1e-7
#  optim_g:
#    type: AdamW
#    lr: !!float 2e-4
#
#  scheduler:
#    type: LinearWarmupCosineAnnealingLR
#    warmup_epochs: 40000
#    max_epochs: 600000

  total_iter: 1000000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FourierLoss
    loss_weight: 0.01
    reduction: mean


# validation settings
val:
  use_amp: false
  speed: false
  val_freq: !!float 2e4
  save_img: false
  max_idx: 600
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
#    ssim:
#      type: calculate_ssim
#      crop_border: 0
#      test_y_channel: false
#      image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500