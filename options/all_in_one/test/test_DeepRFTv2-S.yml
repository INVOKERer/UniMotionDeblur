metric_avg_list: [['HIDE', 'REDS', 'RSBlur', 'LOLBlur', 'RealBlur_R', 'RealBlur_J'], ['RealBlur_R', 'RealBlur_J'], ['MIORe', 'VAR-MIORe'], ['MIORe', 'BSD'], ['MIORe', 'BSD', 'FoundIR', 'RealLOL', 'ReLoBlur']]
align_list:
  names: []

network_g:
  type: DeepRFTv2
  small_scale: false
  mid_scale: true
  save_memory_global_encoder: [false, false, false, false]
  save_memory_global_decoder: [false, false, false, false]
  save_memory_kernel: [false, false, false, false]
  get_ker: false
  inp_channels: 3
  out_channels: 3
  dims: [48, 48, 48] # [64, 512, 256, 512] # [32, 64, 512, 256]
  num_global_unet: 2
  deblur_kernel_mode: ker_max_mid # ker_max_mid_small ker_max_mid ker_max no_ker
  deblur_kernel: true
  deblur_mask: false
  latent_sharp: true
  inp_feature: feature  # inp_latentsharp_feature
  deconv_feature: feature
  norm_type: LayerNorm  # LayerNorm BatchNorm  InstanceNorm None
  spatial_add: false
  spatial_decoder: false
  num_ker: 48
  pad_size: 0
  dims_ker: [48, 48, 48]  #  32
  ks: [0, 0, 0] # [0, 0, 0] # [32, 16, 8]
#  sub_image: false
  sub_image_size: [128, 128]
  train_size: [ 384, 384 ]
  patch_size: [ 384, 384 ]
  overlap_size: [16, 16] # [440, 440] [48, 48] #
  downsample: concat # concat_downsample # downsample downsample_concat
  downsample_ker: concat_nodownsample # noconcat_nodownsample concat_nodownsample
  downsample_mode: conv # bilinear shuffle_conv conv_shuffle conv
  upsample_mode: conv1x1_shuffle   # bilinear conv1x1_shuffle shuffle_conv conv_shuffle conv
  fuse_downsample_mode: conv
  fuse_upsample_mode: conv1x1_shuffle
  fuse_method_encoder: Fuse_in_Encoder # a DownSample2shallow # b Fuse_in_Encoder # c Fuse_in_Encoder2shallow # NoFuse # DownSampleAdd
  fuse_method_decoder: DownSample2latent # d DownSample2latent # e Fuse_in_Decoder # f Fuse_in_Decoder2latent # UpSampleAdd012
  num_heads_enc: [1, 2, 4, 8]
  num_heads_dec: [8, 4, 2, 1] # ['fcnaf', 'fcnaf', 'fcnaf'] ['naf', 'naf', 'naf'] fdmambaforward_naf fsmambaforward_naf fmambaforward_naf fouriernaf flocalmambaforward_naf
  baseblock_enc_small: [['localnaf', 'localnaf', 'localnaf'], ['localnaf', 'localnaf', 'localnaf']] # ASSMBlock
  baseblock_dec_small: [['localnaf', 'localnaf', 'localnaf'], ['localnaf', 'localnaf', 'localnaf']]
  baseblock_enc_mid: [['localnaf', 'localnaf', 'localnaf'], ['localnaf', 'localnaf', 'localnaf']]
  baseblock_dec_mid: [['localnaf', 'localnaf', 'localnaf'], ['localnaf', 'localnaf', 'localnaf']]
  baseblock_enc_max: [ [ 'localnaf', 'localnaf', 'localnaf' ], [ 'localnaf', 'localnaf', 'localnaf' ] ]
  baseblock_dec_max: [ [ 'localnaf', 'localnaf', 'localnaf' ], [ 'localnaf', 'localnaf', 'localnaf' ] ]
#  baseblock_enc_max_global: [['localnaf', 'LocalNAFEVSBlock_patch', 'LocalNAFEVSBlock_patch'], ['localnaf', 'LocalNAFEVSBlock_patch', 'LocalNAFEVSBlock_patch']] # localnaf naf_patch logfouriernaf LocalNAFEVSBlock_patch
#  baseblock_dec_max_global: [['LocalNAFEVSBlock_patch', 'LocalNAFEVSBlock_patch', 'localnaf'], ['LocalNAFEVSBlock_patch', 'LocalNAFEVSBlock_patch', 'localnaf']]
  baseblock_enc_ker: [ 'SS2D', 'SS2D', 'SS2D', 'SS2D'] # EVSBlock EVSS nafwoffn ResBlock LNResBlock
  baseblock_dec_ker: [ 'SS2D', 'SS2D', 'SS2D', 'SS2D'] # kerv1LN kerv2LN ResBlock naf LNResBlock LNResBlock1x1
  enc_small_layers: [ 1, 4, 8 ]
  dec_small_layers: [ 8, 4, 1 ]
  enc_mid_layers: [[ 1, 4, 8 ], [ 1, 4, 8 ]]
  dec_mid_layers: [[ 8, 4, 1 ], [ 8, 4, 1 ]]
  enc_max_layers: [[ 1, 4, 8 ], [ 1, 4, 8 ]]
  dec_max_layers: [[ 8, 4, 1 ], [ 8, 4, 1 ]]
  enc_ker_layers: [ 1, 1, 1, 1 ] # [ 2, 2, 4 ] # [ 2, 2, 6 ] [ 2, 2, 16 ]
  dec_ker_layers: [ 1, 1, 1, 1 ] # [ 2, 2, 2 ] [ 16, 2, 2 ]
  drop_path: 0.
#  small_enc: false
  mid_flip: false
  save_memory: false
  kernel_size: 65 # 19 31
  window_size: 8


path:
#  pretrain_network_g: /data/mxt_code/AllinOne/experiments/Ablation_UniMotionDeblur_NAFNet32_300k_256bs16_noema_1e-3/models/net_g_300000.pth
  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/DeepRFTv2-S/uniMotionDeblur.pth
  param_key_g: params_ema
  strict_load_g: true

slide:
  slide_datasets: []
  mini_bs: 4
  ker_size: [ 384, 384 ]
  overlap_size: [ 48, 48 ]
#  ker_size: [800, 800]
#  overlap_size: [120, 120]

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500