name: Ablation_NAFNet32_noema-5e-4_decay1e-2
suffix: ~  # add suffix to saved images
model_type: TestModel
scale: 1
crop_border: 0  # crop border when evaluation. If None, crop the scale pixels
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  test_BSD1:
    name: BSD1
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/BSD/BSD_1ms8ms/test/sharp
    dataroot_lq: /data/mxt_data/BSD/BSD_1ms8ms/test/blur
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    step: 6

  test_BSD2:
    name: BSD2
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/BSD/BSD_2ms16ms/test/sharp
    dataroot_lq: /data/mxt_data/BSD/BSD_2ms16ms/test/blur
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    step: 6
  test_BSD3:
    name: BSD3
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/BSD/BSD_3ms24ms/test/sharp
    dataroot_lq: /data/mxt_data/BSD/BSD_3ms24ms/test/blur
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    step: 6
