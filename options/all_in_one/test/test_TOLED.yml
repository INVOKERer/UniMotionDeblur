# CUDA_VISIBLE_DEVICES=6 BASICSR_JIT=True python basicsr/test.py -opt options/all_in_one/test/test_MotionDeblur.yml
name: UniDeblur_NAFNet_TOLED
suffix: ~  # add suffix to saved images
model_type: TestModel
scale: 1
crop_border: 0  # crop border when evaluation. If None, crop the scale pixels
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  test_x:
    name: TOLED
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/UDC/TOLED/test/HQ
    dataroot_lq: /data/mxt_data/UDC/TOLED/test/LQ
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1

# network structures
network_g:
  type: NAFNet
  train_size: [1, 3, 256, 256]
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16

path:
  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/NAFNet/net_g_1000000.pth
  param_key_g: params_ema
  strict_load_g: true

slide:
  slide_datasets: []
  mini_bs: 1
  ker_size: [800, 800]
  overlap_size: [120, 120]

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500