# network structures
network_g:
  type: PromptIR
  window_size: 8

path:
  pretrain_network_g: /data/mxt_code/AllinOne/experiments/UniDeblur_PromptIR_600k-2e-4-128bs16_amp/models/net_g_300000.pth
  param_key_g: params
  strict_load_g: true

slide:
  mini_bs: ~
  ker_size: [128, 128]
  overlap_size: [16, 16]


# validation settings
val:
  use_amp: false
  speed: false
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500