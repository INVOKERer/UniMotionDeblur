align_list:
  names: []
slide:
  slide_datasets: []
  mini_bs: 4
  ker_size: [ 384, 384 ]
  overlap_size: [ 48, 48 ]
# network structures
network_g:
  type: NAFNet
  train_size: [1, 3, 256, 256]
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16
