# CUDA_VISIBLE_DEVICES=4 BASICSR_JIT=True python basicsr/test.py -opt options/all_in_one/test/test_NAFNet_deblur.yml
name: UniDeblur_NAFNet
suffix: ~  # add suffix to saved images
model_type: SRModel
scale: 1
crop_border: 0  # crop border when evaluation. If None, crop the scale pixels
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:

  test_DOTA:
    name: DOTA
    dataset_class_idx: 6
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/DOTA/test/target_crops
    dataroot_lq: /data/mxt_data/DOTA/test/input_crops
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    step: 20

# network structures
network_g:
  type: NAFNet
  train_size: [1, 3, 128, 128]
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16

path:
  pretrain_network_g: /data/mxt_code/AllinOne/experiments/UniDeblur_NAFNet_500k-2e-4-128bs16/models/net_g_600000.pth
  param_key_g: params
  strict_load_g: true

#slide:
#  mini_bs: ~
#  ker_size: [128, 128]
#  overlap_size: [16, 16]


# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500