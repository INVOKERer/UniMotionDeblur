  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/MoCEIR/uniMotionDeblur.pth
  param_key_g: params_ema
  strict_load_g: true


#  ker_size: [800, 800]
