# CUDA_VISIBLE_DEVICES=0 BASICSR_JIT=True python basicsr/test.py -opt options/all_in_one/test/test_NAFNet.yml
name: BSD_MoCEIR
suffix: ~  # add suffix to saved images
model_type: TestModel
scale: 1
crop_border: 0  # crop border when evaluation. If None, crop the scale pixels
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  test_m5:
    name: BSD1
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/MotionBlur/BSD1_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
  test_m52:
    name: BSD2
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/MotionBlur/BSD2_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
  test_m53:
    name: BSD3
    dataset_class_idx: 0
    type: PairedImageDataset
    dataroot_gt: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    dataroot_lq: /data/mxt_data/uniDeblur_dataset/test/MotionBlur
    meta_info_file: /data/mxt_data/uniDeblur_dataset/test/MotionBlur/BSD3_meta_info.txt
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1


metric_avg_list: [['BSD1', 'BSD2', 'BSD3']]

align_list:
  names: []
slide:
  slide_datasets: []
  mini_bs: 4
  ker_size: [ 384, 384 ]
  overlap_size: [ 48, 48 ]
