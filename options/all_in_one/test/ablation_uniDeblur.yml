align_list:
  names: []
slide:
  slide_datasets: []
  mini_bs: 16 # 9 15
  ker_size: [ 256, 256 ]
  overlap_size: [ 8, 8 ]
# network structures
#network_g:
#  type: NAFNetX
#  width: 64
#  patch_size: [[64, 64], [32, 32], [16, 16], [8, 8]]
#  patch_size_latent: [8, 8]
#  enc_blk_nums: [1, 1, 1, 28]
#  middle_blk_num: 1
#  dec_blk_nums: [1, 1, 1, 1]
#  window_size: 16
network_g:
  type: uniDeblur
  dim: 32
  num_blocks: [1, 4, 8]
  num_blocks2: [1, 4, 8]
  baseblock: [localnaf, localnaf, localnaf]
  phase_only: false
  FFT_ReLU: false
  kernel_learning: [false, false, true]
  ker_firstblock: [ 'LayerNorm', 'LayerNorm', 'LayerNorm' ] # LayerNorm Identity
  ker_num_firstblocks: [ 1, 1, 1 ]
  ker_baseblock: [ 'ResGateBlock', 'ResGateBlock', 'ResGateBlock' ]
  ker_num_blocks: [ 4, 4, 4 ]
  ker_endblock: ['Identity', 'Identity', 'Identity']
  ker_num_endblocks: [1, 1, 1]
  ffn_expansion_factor: 3
  bias: false
  train_size: [256, 256]
  patch_size: [256, 256]
  ker_size: [[256, 256], [128, 128], [64, 64]]
  overlap_size: [[64, 64], [32, 32], [2, 2]]
#  overlap_size: [[32, 32], [16, 16], [8, 8]]
  k_channels: [ 48, 96, 192 ]
#  k_channels: [ 32, 64, 128 ]
  #  k_channels: [96, 192, 384]
#  ker_size: [ [ 64, 64 ], [ 64, 64 ], [ 64, 64 ] ]
#  overlap_size: [ [ 8, 8 ], [ 8, 8 ], [ 8, 8 ] ]
#  k_channels: [ 192, 192, 192 ]
  ker_start: 1
  window_size: 8
  global_fft: [false, false, false]
  patch_size_fft: [128, 128]
  dec_with_enc: false
  geo_aug: false
  fft_add: false
  flip_transpose_max: false
  supervised_mode: 'MultiScale' # Yes No MultiScale
  loss_weight: [0.5, 0.5, 0.5]

path:
  pretrain_network_g: /data/mxt_code/AllinOne/experiments/Ablation-UniMotionDeblur-32_localnaf148-kerlearnings3-LN-4ResGateBlock-192_300k_256bs16/models/net_g_300000.pth
#  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/uniMotionDeblur/UniMotionDeblur48_localnaf148-kerlearning123-dim192-64.pth
#  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/uniMotionDeblur/UniMotionDeblur48_EVSSM-kerlearning123-dim384.pth
  param_key_g: params_ema
  strict_load_g: false


#  ker_size: [800, 800]
#  overlap_size: [120, 120]

# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500