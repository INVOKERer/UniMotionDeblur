metric_avg_list: []

align_list:
  names: []

slide:
  slide_datasets: []
  mini_bs: 4
  ker_size: [ 384, 384 ]
  overlap_size: [ 48, 48 ]
network_g:
  type: NAFNet
  width: 48
  train_size: [1, 3, 256, 256]
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8

path:
  pretrain_network_g: /data/mxt_code/AllinOne/experiments/Ablation_UniDefocusDeblurv3_NAFNet48_300k_256bs16_ema_5e-4_decay1e-2/models/net_g_100000.pth
  param_key_g: params_ema
  strict_load_g: true

#slide:
#  mini_bs: ~
#  ker_size: [128, 128]
#  overlap_size: [16, 16]


# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500