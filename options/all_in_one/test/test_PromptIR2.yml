metric_avg_list: [['MIORe', 'BSD'], ['MIORe', 'BSD', 'FoundIR', 'RealLOL', 'ReLoBlur']]

align_list:
  names: []
slide:
  slide_datasets: ['RSBlur', 'DPDD', 'DPDD*', 'RealDOF', 'RealDOF*', 'ReLoBlur']
  mini_bs: 1
  ker_size: [ 800, 800 ]
  overlap_size: [ 128, 128 ]
# network structures
network_g:
  type: PromptIR
  window_size: 8
#network_g:
#  type: NAFNetBaseline
#  width: 64
#  enc_blk_nums: [1, 1, 1, 28]
#  middle_blk_num: 1
