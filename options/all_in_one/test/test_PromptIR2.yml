  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/uniDeblur/PromptIR/uniMotionDeblur.pth
  param_key_g: params_ema
  strict_load_g: true


#  ker_size: [800, 800]
#  overlap_size: [120, 120]

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    niqe:
      type: calculate_niqe
      crop_border: 0
#    lpips:
#      type: calculate_lpips
#      crop_border: 0
# dist training settings
dist_params:
  backend: nccl
  port: 29500